[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "parkash-cli"
version = "0.1.0"
description = "Developer CLI for the Parkash Book Depot API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12.0",
    "httpx>=0.27.0",
    "rich>=13.0.0",
]

[project.scripts]
parkash = "cli.main:run"

[tool.setuptools.packages.find]
where = [".."]
include = ["cli*"]
