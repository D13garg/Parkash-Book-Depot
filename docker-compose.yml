services:
  mongodb:
    image: mongo:7
    container_name: parkash_mongo
    restart: unless-stopped
    ports:
      - "27018:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-changeme}
      MONGO_INITDB_DATABASE: parkash_book_depot
    volumes:
      - mongo_data:/data/db
    networks:
      - parkash_network

  backend:
    build:
      context: ./backend
      target: production
    container_name: parkash_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      SECRET_KEY: ${SECRET_KEY}
      PEPPER: ${PEPPER}
      MONGODB_URL: ${MONGODB_URL}
      MONGODB_DB_NAME: parkash_book_depot
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
    depends_on:
      - mongodb
    networks:
      - parkash_network

  frontend:
    build:
      context: ./frontend
      target: production
    container_name: parkash_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - parkash_network

volumes:
  mongo_data:

networks:
  parkash_network:
    driver: bridge